  <g stroke="#A98748" stroke-width="9" stroke-linecap="round" opacity="0.85">
    <line x1="150" y1="212" x2="226" y2="222"/><line x1="150" y1="250" x2="226" y2="260"/><line x1="150" y1="288" x2="226" y2="298"/>
    <line x1="286" y1="222" x2="362" y2="212"/><line x1="286" y1="260" x2="362" y2="250"/><line x1="286" y1="298" x2="362" y2="288"/>
  </g>
  <!-- gold bookmark ribbon -->
  <path d="M300 150 L300 246 L322 224 L344 246 L344 150 Z" fill="#C4A35A"/>
