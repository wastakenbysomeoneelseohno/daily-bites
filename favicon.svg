<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Daily Bread">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A2A18"/><stop offset="1" stop-color="#15100A"/>
    </linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E7CC"/><stop offset="1" stop-color="#D8C49A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- sunrise glow above the book ("daily") -->
  <circle cx="256" cy="150" r="46" fill="#C4A35A" opacity="0.16"/>
  <circle cx="256" cy="150" r="26" fill="#C4A35A" opacity="0.30"/>
